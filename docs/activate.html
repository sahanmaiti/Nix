<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Activating Nix…</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: -apple-system, sans-serif;
            text-align: center;
            padding: 80px 20px;
            background: #0d0d0f;
            color: #fff;
        }

        a {
            color: #7047EB;
        }
    </style>
</head>

<body>
    <h2>Activating Nix…</h2>
    <p id="msg">If nothing happens, <a id="fallback" href="#">click here to open Nix</a>.</p>
    <script>
        const params = new URLSearchParams(window.location.search);
        const key = params.get('key');
        if (key) {
            const deepLink = 'nix://activate?key=' + encodeURIComponent(key);
            document.getElementById('fallback').href = deepLink;
            window.location.href = deepLink;
        } else {
            document.getElementById('msg').textContent = 'No license key found in URL.';
        }
    </script>
</body>

</html>
